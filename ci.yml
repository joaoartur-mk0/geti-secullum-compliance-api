name: CI/CD - SolaChat

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sast-security:
    name: SAST (Gosec & Opengrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Executar Gosec (AST Security)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated -severity medium ./...

      - name: Executar Opengrep (Semantic SAST)
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          
          # Baixa as regras open-source compatíveis (Semgrep Community Rules)
          git clone --depth 1 https://github.com/opengrep/opengrep-rules.git /tmp/rules
          
          # Executa o scan apontando para as regras de Go e Segurança
          opengrep scan \
            -f /tmp/rules/go \
            -f /tmp/rules/dockerfile \
            --error .
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t sola-chat:ci .
