# Stack LOCAL de testes: backend + Postgres + RabbitMQ + frontend (painel administrativo).
#
# Uso:
#   cd infrastructure
#   docker compose -f docker-compose.local.yml up -d --build
#
#   Painel:             http://localhost:5500
#   API:                http://localhost:8080  (base URL padrão do painel)
#   RabbitMQ mgmt:      http://localhost:15672
#
# Para desenvolvimento do painel com HMR, prefira `npm run dev` em frontend/ (porta 5173).
#
# Isolado do docker-compose.yml (nomes/volumes com sufixo -local), então pode rodar
# sem conflitar com o stack base.
version: "3.8"

services:
  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: secullum-compliance-app-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=host=db user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-auditoria_db} port=5432 sslmode=disable
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - PORT=8080
      - GIN_MODE=release
      # Credenciais GLOBAIS da Secullum (necessárias para a auditoria). Vêm do .env.
      - SECULLUM_API_URL=${SECULLUM_API_URL:-https://pontowebintegracaoexterna.secullum.com.br}
      - SECULLUM_AUTH_URL=${SECULLUM_AUTH_URL:-}
      - SECULLUM_USERNAME=${SECULLUM_USERNAME:-}
      - SECULLUM_PASSWORD=${SECULLUM_PASSWORD:-}
      - SECULLUM_API_TOKEN=${SECULLUM_API_TOKEN:-}
      # Credenciais GLOBAIS da Evolution API (envio de alertas via WhatsApp). Vêm do .env.
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE_PREFIX=${EVOLUTION_INSTANCE_PREFIX:-tenant}
      # Autenticação do painel (login JWT + seed do super admin). Vêm do .env.
      - JWT_SECRET=${JWT_SECRET:-}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - secullum_network

  # Painel administrativo: build multi-stage (Node -> nginx) feito pelo próprio compose.
  # O painel roda no navegador do host e chama a API em http://localhost:8080
  # (configurável na tela de login). O CORS de dev do backend libera essa chamada.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
          # URL pública da API, embutida no bundle. Deriva do APP_DOMAIN do .env.
          VITE_API_URL: http://localhost:8080
    container_name: secullum-compliance-frontend-local
    restart: unless-stopped
    ports:
      - "5500:80"
    depends_on:
      - app
    networks:
      - secullum_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: secullum-compliance-rabbitmq-local
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data_local:/var/lib/rabbitmq
    networks:
      - secullum_network

  db:
    image: postgres:15-alpine
    container_name: secullum-compliance-postgres-local
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auditoria_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - secullum_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-auditoria_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data_local:
    driver: local
  postgres_data_local:
    driver: local

networks:
  secullum_network:
    driver: bridge
