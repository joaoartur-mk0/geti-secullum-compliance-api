version: "3.8"

services:
  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: secullum-compliance-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=host=db user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-auditoria_db} port=5432 sslmode=disable
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - PORT=8080
      - GIN_MODE=release
      # Credenciais GLOBAIS da Secullum (necessárias para a auditoria). Vêm do .env.
      - SECULLUM_API_URL=${SECULLUM_API_URL:-https://pontowebintegracaoexterna.secullum.com.br}
      - SECULLUM_AUTH_URL=${SECULLUM_AUTH_URL:-}
      - SECULLUM_USERNAME=${SECULLUM_USERNAME:-}
      - SECULLUM_PASSWORD=${SECULLUM_PASSWORD:-}
      - SECULLUM_API_TOKEN=${SECULLUM_API_TOKEN:-}
      # Credenciais GLOBAIS da Evolution API (envio de alertas via WhatsApp). Vêm do .env.
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE_PREFIX=${EVOLUTION_INSTANCE_PREFIX:-tenant}
      # Autenticação do painel (login JWT + seed do super admin). Vêm do .env.
      - JWT_SECRET=${JWT_SECRET:-}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - secullum_network
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: secullum-compliance-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - secullum_network

  db:
    image: postgres:15-alpine
    container_name: secullum-compliance-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auditoria_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secullum_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-auditoria_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local

networks:
  secullum_network:
    driver: bridge
