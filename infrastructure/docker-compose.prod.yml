# Stack de PRODUÇÃO.
#
# Pré-requisitos no host:
#   - Rede externa "public" já criada e com o container do Traefik conectado a ela
#     (docker network create public), pois é ela quem expõe o tráfego HTTP(S).
#   - Variável APP_DOMAIN definida no .env com o domínio público da API
#     (ex.: APP_DOMAIN=api.seudominio.com.br).
#
# Uso:
#   cd infrastructure
#   docker compose -f docker-compose.prod.yml up -d --build
#
# DB e RabbitMQ não publicam porta no host: só o Traefik (rede "public") expõe
# tráfego externo; o restante do stack se comunica apenas pela rede interna.
version: "3.8"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: secullum-compliance-app-prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=host=db user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-auditoria_db} port=5432 sslmode=disable
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - PORT=8080
      - GIN_MODE=release
      # Credenciais GLOBAIS da Secullum (necessárias para a auditoria). Vêm do .env.
      - SECULLUM_API_URL=${SECULLUM_API_URL:-https://pontowebintegracaoexterna.secullum.com.br}
      - SECULLUM_AUTH_URL=${SECULLUM_AUTH_URL:-}
      - SECULLUM_USERNAME=${SECULLUM_USERNAME:-}
      - SECULLUM_PASSWORD=${SECULLUM_PASSWORD:-}
      - SECULLUM_API_TOKEN=${SECULLUM_API_TOKEN:-}
      # Credenciais GLOBAIS da Evolution API (envio de alertas via WhatsApp). Vêm do .env.
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE_PREFIX=${EVOLUTION_INSTANCE_PREFIX:-tenant}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - public
      - secullum_network
    labels:
      - traefik.enable=true
      - traefik.docker.network=public
      # Domínio vindo de variável de ambiente (.env): APP_DOMAIN=api.seudominio.com.br
      - traefik.http.routers.secullum-compliance-app.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.secullum-compliance-app.entrypoints=websecure
      - traefik.http.routers.secullum-compliance-app.tls=true
      - traefik.http.routers.secullum-compliance-app.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.secullum-compliance-app.loadbalancer.server.port=8080

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: secullum-compliance-rabbitmq-prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    networks:
      - secullum_network

  db:
    image: postgres:15-alpine
    container_name: secullum-compliance-postgres-prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auditoria_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - secullum_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-auditoria_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data_prod:
    driver: local
  postgres_data_prod:
    driver: local

networks:
  public:
    external: true
  secullum_network:
    driver: bridge
