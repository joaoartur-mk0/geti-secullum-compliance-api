openapi: 3.0.3
info:
  title: Secullum Compliance API
  description: >
    Microsserviço de auditoria diária de jornada de trabalho. Consome batidas de ponto
    da API SecullumWEB, aplica regras de compliance trabalhista (CLT) e disponibiliza
    relatórios de inconsistências. Esta documentação cobre os endpoints administrativos
    (CRUD) usados pela interface web de configuração e o disparo de auditoria.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Ambiente de desenvolvimento local

security:
  - bearerAuth: []

tags:
  - name: Infra
    description: Saúde da infraestrutura
  - name: Autenticação
    description: >
      Login e gestão de usuários do painel interno. Ver docs/05_Auth_Backend_Contract.md
      para o contrato completo (fluxo, formato do token, seed do primeiro usuário).
  - name: Auditoria
    description: Disparo e consulta de auditorias
  - name: Tenants
    description: CRUD de inquilinos (clientes)
  - name: Configurações
    description: Regras e severidades por tenant
  - name: Responsáveis
    description: Gestores (staff) que recebem alertas
  - name: Relatórios
    description: Painel de consulta de auditorias
  - name: Ocorrências
    description: >
      Máquina de estados das inconsistências. Cada ocorrência tem identidade estável
      (colaborador + data + tipo) e evolui entre aberta / atualizada /
      resolvida_automatica / resolvida_manual, com log de transições. Ver
      docs/06_Occurrences_Backend_Contract.md.
  - name: Filiais
    description: Unidades físicas, aparelhos de ponto e gestor responsável
  - name: Advertências
    description: Registro do processo de advertência (rascunho, enviada, assinada)
  - name: Colaboradores
    description: Espelho local de funcionários e autopreenchimento das telas

paths:
  /health:
    get:
      tags: [Infra]
      summary: Verifica a saúde da infraestrutura (DB e broker)
      security: []
      responses:
        "200":
          description: Tudo operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: up }
                  rabbitmq: { type: string, example: up }
        "503":
          description: Banco ou broker indisponível

  /api/v1/auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica um usuário e devolve um token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "JWT (Bearer), válido por 24h" }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/auth/register:
    post:
      tags: [Autenticação]
      summary: Cadastra um novo usuário (requer um usuário já autenticado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }

  /api/v1/users:
    get:
      tags: [Autenticação]
      summary: Lista usuários
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Autenticação]
      summary: Busca um usuário por id
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    delete:
      tags: [Autenticação]
      summary: Exclui um usuário
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/users/{id}/email:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Autenticação]
      summary: Atualiza o e-mail de um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Autenticação]
      summary: Atualiza a senha de um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8 }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }

  /api/v1/audit/trigger:
    post:
      tags: [Auditoria]
      summary: Enfileira uma auditoria para um tenant (processamento assíncrono)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRequest"
      responses:
        "202":
          description: Auditoria aceita para processamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  tenant_id: { type: integer }
                  date: { type: string, example: "2026-07-12" }
                  status: { type: string, example: processing }
        "400": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/tenants:
    get:
      tags: [Tenants]
      summary: Lista tenants
      parameters:
        - name: include_inactive
          in: query
          description: Se "true", inclui tenants desativados
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Lista de tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items: { $ref: "#/components/schemas/Tenant" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenants]
      summary: Cadastra um tenant (com um responsável e configurações padrão)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  tenant: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Tenants]
      summary: Busca um tenant por id
      responses:
        "200":
          description: Tenant encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    put:
      tags: [Tenants]
      summary: Atualiza nome e/ou secullum_database_id do tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }

  /api/v1/tenants/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    patch:
      tags: [Tenants]
      summary: Desativa um tenant (soft-deactivation)
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/tenants/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [Tenants]
      summary: >
        Enfileira a sincronização de colaboradores (funcionários e jornadas) a partir
        da Secullum. Disparado automaticamente no cadastro do tenant; pode ser
        reacionado aqui sob demanda (ex.: após mudanças no cadastro de funcionários).
      responses:
        "202":
          description: Sincronização aceita para processamento assíncrono
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  tenant_id: { type: integer }
                  status: { type: string, example: processing }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/tenants/{id}/settings:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Configurações]
      summary: Busca as configurações de regras do tenant
      responses:
        "200":
          description: Configurações do tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/Settings" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    put:
      tags: [Configurações]
      summary: Atualiza flags, severidades e horários de varredura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/tenants/{id}/staffs:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Responsáveis]
      summary: Lista os responsáveis (staff) do tenant
      responses:
        "200":
          description: Lista de responsáveis
          content:
            application/json:
              schema:
                type: object
                properties:
                  staffs:
                    type: array
                    items: { $ref: "#/components/schemas/Staff" }
    post:
      tags: [Responsáveis]
      summary: Cadastra um responsável no tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRequest"
      responses:
        "201":
          description: Responsável criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  staff: { $ref: "#/components/schemas/Staff" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/staffs/{staffId}:
    parameters:
      - name: staffId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Responsáveis]
      summary: Atualiza um responsável
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRequest"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    delete:
      tags: [Responsáveis]
      summary: Exclui um responsável
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/tenants/{id}/reports:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Relatórios]
      summary: Lista os relatórios de auditoria do tenant (mais recentes primeiro)
      responses:
        "200":
          description: Lista de relatórios
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items: { $ref: "#/components/schemas/Report" }

  /api/v1/tenants/{id}/occurrences:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Ocorrências]
      summary: Lista as ocorrências do tenant, já com horário fixo e filial
      description: >
        Cada ocorrência aparece UMA vez, com o estado atual — não é a lista de
        inconsistências por varredura. Sem o filtro `state`, devolve apenas o que ainda
        pede ação (aberta e atualizada).
      parameters:
        - name: date
          in: query
          schema: { type: string, example: "2026-07-12" }
          description: Dia único (YYYY-MM-DD). Tem precedência sobre start_date/end_date.
        - name: start_date
          in: query
          schema: { type: string, example: "2026-07-01" }
        - name: end_date
          in: query
          schema: { type: string, example: "2026-07-31" }
        - name: state
          in: query
          schema: { type: string, example: "aberta,atualizada" }
          description: Lista separada por vírgula. Padrão "aberta,atualizada".
        - name: collaborator_id
          in: query
          schema: { type: integer }
          description: Id do colaborador na Secullum.
        - name: branch_id
          in: query
          schema: { type: integer }
          description: Filtra pela filial resolvida (aparelho ou nº de folha).
      responses:
        "200":
          description: Lista de ocorrências
          content:
            application/json:
              schema:
                type: object
                properties:
                  occurrences:
                    type: array
                    items: { $ref: "#/components/schemas/Occurrence" }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/occurrences/{occurrenceId}/ignore:
    parameters:
      - $ref: "#/components/parameters/OccurrenceId"
    patch:
      tags: [Ocorrências]
      summary: Ignora uma ocorrência (marca resolvida_manual)
      description: >
        Decisão pegajosa: as varreduras seguintes continuam apurando a inconsistência,
        mas não a trazem de volta ao radar. Motivo e autor ficam no log de eventos.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: "Abonado pelo RH — atestado entregue" }
      responses:
        "200":
          description: Ocorrência ignorada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  state: { type: string, example: resolvida_manual }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/occurrences/{occurrenceId}/events:
    parameters:
      - $ref: "#/components/parameters/OccurrenceId"
    get:
      tags: [Ocorrências]
      summary: Log de transições da ocorrência (do mais antigo ao mais recente)
      responses:
        "200":
          description: Histórico de transições
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/OccurrenceEvent" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/tenants/{id}/collaborators/{secullumId}/prefill:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: secullumId
        in: path
        required: true
        description: Id do colaborador na Secullum
        schema: { type: integer }
    get:
      tags: [Colaboradores]
      summary: Horário fixo e filial do colaborador, prontos para autopreenchimento
      parameters:
        - name: date
          in: query
          schema: { type: string, example: "2026-07-12" }
          description: >
            Opcional. Quando informada, tenta resolver a filial pelo aparelho da batida
            daquele dia; sem ela (ou se a Secullum falhar), a filial vem do nº de folha.
      responses:
        "200":
          description: Dados de autopreenchimento
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaborator:
                    type: object
                    properties:
                      id: { type: integer }
                      secullum_id: { type: integer }
                      name: { type: string }
                      numero_folha: { type: string, example: "9" }
                  horario_fixo:
                    type: array
                    items: { $ref: "#/components/schemas/FixedSchedule" }
                  filial:
                    allOf: [{ $ref: "#/components/schemas/BranchSummary" }]
                    nullable: true
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/tenants/{id}/branches:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Filiais]
      summary: Lista as filiais do tenant
      responses:
        "200":
          description: Lista de filiais
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches:
                    type: array
                    items: { $ref: "#/components/schemas/Branch" }
    post:
      tags: [Filiais]
      summary: Cadastra uma filial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchRequest" }
      responses:
        "201":
          description: Filial criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  branch: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/branches/{branchId}:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    get:
      tags: [Filiais]
      summary: Detalha uma filial (com aparelhos e nº de folha vinculados)
      responses:
        "200":
          description: Filial
          content:
            application/json:
              schema:
                type: object
                properties:
                  branch: { $ref: "#/components/schemas/Branch" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    put:
      tags: [Filiais]
      summary: Atualiza a filial e os dados do gestor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    delete:
      tags: [Filiais]
      summary: Exclui a filial (junto com aparelhos e nº de folha vinculados)
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/branches/{branchId}/devices:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    post:
      tags: [Filiais]
      summary: Vincula um aparelho de ponto à filial
      description: >
        Um aparelho pertence a uma única filial: vincular um `secullum_equip_id` que já
        esteja em outra filial devolve 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secullum_equip_id]
              properties:
                secullum_equip_id: { type: integer, example: 4 }
                label: { type: string, example: "Recepção" }
      responses:
        "201":
          description: Aparelho vinculado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  device: { $ref: "#/components/schemas/BranchDevice" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/ConflictError" }

  /api/v1/branches/{branchId}/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/BranchId"
      - name: deviceId
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Filiais]
      summary: Desvincula um aparelho da filial
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/branches/{branchId}/payroll-numbers:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    post:
      tags: [Filiais]
      summary: Lota um colaborador (nº de folha) na filial
      description: >
        É o caminho de resolução usado quando a batida não identifica o aparelho — o caso
        das marcações feitas pelo app/web. Único por tenant: 409 se já pertencer a outra
        filial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numero]
              properties:
                numero: { type: string, example: "9" }
      responses:
        "201":
          description: Nº de folha vinculado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  payroll_number: { $ref: "#/components/schemas/BranchPayrollNumber" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/ConflictError" }

  /api/v1/branches/{branchId}/payroll-numbers/{payrollNumberId}:
    parameters:
      - $ref: "#/components/parameters/BranchId"
      - name: payrollNumberId
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Filiais]
      summary: Remove a lotação de um nº de folha na filial
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /api/v1/tenants/{id}/warnings:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Advertências]
      summary: Lista as advertências do tenant
      parameters:
        - name: collaborator_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [draft, enviada, assinada] }
      responses:
        "200":
          description: Lista de advertências
          content:
            application/json:
              schema:
                type: object
                properties:
                  warnings:
                    type: array
                    items: { $ref: "#/components/schemas/Warning" }
                  total: { type: integer }
                  counts:
                    type: object
                    description: Contagem por status (alimenta o indicador enviadas x assinadas).
                    properties:
                      draft: { type: integer }
                      enviada: { type: integer }
                      assinada: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Advertências]
      summary: Registra uma advertência (nasce em rascunho por padrão)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWarningRequest" }
      responses:
        "201":
          description: Advertência registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  warning: { $ref: "#/components/schemas/Warning" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/warnings/{warningId}:
    parameters:
      - $ref: "#/components/parameters/WarningId"
    get:
      tags: [Advertências]
      summary: Detalha uma advertência
      responses:
        "200":
          description: Advertência
          content:
            application/json:
              schema:
                type: object
                properties:
                  warning: { $ref: "#/components/schemas/Warning" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    put:
      tags: [Advertências]
      summary: Edita o texto da advertência (somente em rascunho)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                branch_id: { type: integer, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
    delete:
      tags: [Advertências]
      summary: Exclui a advertência (somente em rascunho)
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }

  /api/v1/warnings/{warningId}/status:
    parameters:
      - $ref: "#/components/parameters/WarningId"
    patch:
      tags: [Advertências]
      summary: Avança o status da advertência
      description: >
        O fluxo é de mão única — draft → enviada → assinada. Repetir o status atual é
        idempotente; qualquer outro salto devolve 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, enviada, assinada] }
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  status: { type: string, example: enviada }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token obtido em POST /api/v1/auth/login. Enviar em todas as rotas de /api/v1,
        exceto /api/v1/auth/login e /health: header "Authorization: Bearer <token>".

  parameters:
    TenantId:
      name: id
      in: path
      required: true
      description: Id local do tenant
      schema: { type: integer }
    UserId:
      name: id
      in: path
      required: true
      description: Id do usuário
      schema: { type: integer }
    OccurrenceId:
      name: occurrenceId
      in: path
      required: true
      description: Id local da ocorrência
      schema: { type: integer }
    BranchId:
      name: branchId
      in: path
      required: true
      description: Id local da filial
      schema: { type: integer }
    WarningId:
      name: warningId
      in: path
      required: true
      description: Id local da advertência
      schema: { type: integer }

  responses:
    Message:
      description: Operação bem-sucedida
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    ValidationError:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnauthorizedError:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ForbiddenError:
      description: Sem vínculo com o tenant dono do recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFoundError:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ConflictError:
      description: "Conflito (ex.: secullum_database_id duplicado)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Erro interno inesperado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: Formato padronizado de erro da API.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION, NOT_FOUND, CONFLICT, INTERNAL, UNAUTHORIZED]
            message: { type: string }
            details: { type: string, nullable: true }

    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Fulano de Tal" }
        email: { type: string, format: email, example: "fulano@empresa.com" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    TriggerRequest:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: { type: integer, example: 1 }
        date:
          type: string
          example: "2026-07-12"
          description: >
            Opcional. Dia a auditar (YYYY-MM-DD), para conferir a situação de uma data
            específica sob demanda. Omitido, audita D-1 — o mesmo que faz a varredura
            diária automática. Só datas já encerradas (anteriores a hoje) são aceitas.

    Tenant:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Empresa Exemplo S.A." }
        secullum_database_id: { type: integer, example: 123 }
        active: { type: boolean, example: true }

    CreateTenantRequest:
      type: object
      required: [name, secullum_database_id, staff_name, staff_contact]
      properties:
        name: { type: string, example: "Empresa Exemplo S.A." }
        secullum_database_id: { type: integer, example: 123 }
        staff_name: { type: string, example: "Fulano de Tal" }
        staff_contact: { type: string, example: "5531999999999" }

    UpdateTenantRequest:
      type: object
      required: [name, secullum_database_id]
      properties:
        name: { type: string }
        secullum_database_id: { type: integer }

    Staff:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        name: { type: string }
        celular: { type: string, example: "5531999999999" }

    StaffRequest:
      type: object
      required: [name, celular]
      properties:
        name: { type: string }
        celular: { type: string }

    Settings:
      type: object
      description: >
        Flags habilitam/desabilitam cada regra. Severidades ("ALERTA" ou "CRITICO")
        são configuráveis por tenant, exceto a de hora extra (limiares legais).
      properties:
        almoco: { type: boolean }
        interjornada: { type: boolean }
        hextras: { type: boolean }
        esquecimento: { type: boolean }
        almoco_severity: { type: string, enum: [ALERTA, CRITICO] }
        interjornada_severity: { type: string, enum: [ALERTA, CRITICO] }
        esquecimento_severity: { type: string, enum: [ALERTA, CRITICO] }
        horarios:
          type: array
          items: { type: string, example: "18:30" }

    AuditInconsistency:
      type: object
      description: >
        Nota: os campos seguem o nome das structs Go (sem json tags), por isso a
        capitalização difere do restante da API.
      properties:
        CollaboratorID: { type: integer }
        CollaboratorName: { type: string }
        Type: { type: string, example: "Interjornada Curta" }
        Severity: { type: string, enum: [ALERTA, CRITICO] }
        Description: { type: string }

    Report:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        date: { type: string, example: "2026-07-12" }
        data_generated: { type: string, format: date-time }
        total: { type: integer, description: "Número de inconsistências" }
        inconsistencies:
          type: array
          items: { $ref: "#/components/schemas/AuditInconsistency" }

    Occurrence:
      type: object
      description: >
        Inconsistência com identidade estável (tenant + colaborador + data + tipo) e
        estado próprio. Auditar o mesmo dia de novo atualiza esta linha; nunca cria outra.
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        collaborator_id: { type: integer, description: "Id do colaborador na Secullum" }
        collaborator_name: { type: string }
        date: { type: string, example: "2026-07-12" }
        type: { type: string, example: "Interjornada Curta" }
        severity: { type: string, enum: [ALERTA, CRITICO, OPERACIONAL] }
        category:
          type: string
          enum: [CRITICO, ALERTA, ALTERACAO_ESCALA, NAO_CONFIRMADA]
          description: >
            Agrupamento de exibição, derivado de estado + severidade. NAO_CONFIRMADA
            quando o valor mudou desde a última varredura (estado atualizada);
            ALTERACAO_ESCALA para a severidade OPERACIONAL (escala desatualizada).
        description: { type: string }
        state:
          type: string
          enum: [aberta, atualizada, resolvida_automatica, resolvida_manual]
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        times_seen: { type: integer, description: "Quantas varreduras apuraram esta ocorrência" }
        resolved_at: { type: string, format: date-time, nullable: true }
        ignored_reason: { type: string }
        ignored_by_user_id: { type: integer, nullable: true }
        horario_fixo:
          type: array
          items: { $ref: "#/components/schemas/FixedSchedule" }
        filial:
          allOf: [{ $ref: "#/components/schemas/BranchSummary" }]
          nullable: true

    OccurrenceEvent:
      type: object
      description: Transição registrada no log append-only da ocorrência.
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [criada, atualizada, resolvida_automatica, resolvida_manual, reaberta]
        from_state: { type: string }
        to_state: { type: string }
        from_description: { type: string }
        to_description: { type: string }
        reason: { type: string, description: "Motivo informado ao ignorar" }
        actor_user_id: { type: integer, nullable: true, description: "null nas transições automáticas" }
        created_at: { type: string, format: date-time }

    FixedSchedule:
      type: object
      description: Um dia da grade de horário fixo cadastrada na Secullum.
      properties:
        dia_semana: { type: integer }
        entrada_1: { type: string, example: "08:00" }
        saida_1: { type: string, example: "12:00" }
        entrada_2: { type: string, example: "14:00" }
        saida_2: { type: string, example: "18:00" }
        carga_minutos: { type: integer, example: 480 }

    BranchSummary:
      type: object
      description: Filial resolvida, com a origem da informação.
      properties:
        id: { type: integer }
        name: { type: string }
        manager_name: { type: string }
        manager_phone: { type: string }
        source:
          type: string
          enum: [aparelho, numero_folha]
          description: >
            "aparelho" = deduzida do EquipId da batida do dia (a pessoa esteve lá);
            "numero_folha" = do cadastro de lotação.

    Branch:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        name: { type: string, example: "Filial Centro" }
        manager_name: { type: string, example: "Fulano de Tal" }
        manager_phone: { type: string, example: "5531999999999" }
        devices:
          type: array
          items: { $ref: "#/components/schemas/BranchDevice" }
        payroll_numbers:
          type: array
          items: { $ref: "#/components/schemas/BranchPayrollNumber" }

    BranchRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        manager_name: { type: string }
        manager_phone: { type: string }

    BranchDevice:
      type: object
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        secullum_equip_id: { type: integer, description: "EquipId do relógio de ponto na Secullum" }
        label: { type: string, example: "Recepção" }

    BranchPayrollNumber:
      type: object
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        numero: { type: string, example: "9" }

    Warning:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        occurrence_id: { type: integer, nullable: true }
        collaborator_id: { type: integer, description: "Id do colaborador na Secullum" }
        collaborator_name: { type: string }
        branch_id: { type: integer, nullable: true }
        body: { type: string }
        status: { type: string, enum: [draft, enviada, assinada] }
        created_by_user_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
        signed_at: { type: string, format: date-time, nullable: true }

    CreateWarningRequest:
      type: object
      required: [collaborator_id]
      properties:
        collaborator_id: { type: integer, description: "Id do colaborador na Secullum" }
        occurrence_id: { type: integer, nullable: true, description: "Ocorrência que motivou a advertência" }
        branch_id: { type: integer, nullable: true }
        body: { type: string }
        status:
          type: string
          enum: [draft, enviada, assinada]
          description: Opcional; omitido, a advertência nasce como rascunho.
